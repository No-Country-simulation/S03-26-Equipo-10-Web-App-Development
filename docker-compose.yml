services:
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testimonial_cms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres18-data:/var/lib/postgresql
    networks:
      - backend_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-testimonial_cms}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    hostname: redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    networks:
      - backend_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  pgadmin:
    profiles: [debug]
    image: dpage/pgadmin4:8.3
    hostname: pgadmin
    user: root
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    hostname: api
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_network
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/${POSTGRES_DB:-testimonial_cms}?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env file with at least 32 characters}
      - WEBHOOK_LEGACY_HTTP_STARTED_AT=${WEBHOOK_LEGACY_HTTP_STARTED_AT:-}
      - WEBHOOK_SIGNATURE_LEGACY_STARTED_AT=${WEBHOOK_SIGNATURE_LEGACY_STARTED_AT:-}
      - WEBHOOK_SECRET_KEYS_JSON=${WEBHOOK_SECRET_KEYS_JSON:-}
      - WEBHOOK_SECRET_CURRENT_VERSION=${WEBHOOK_SECRET_CURRENT_VERSION:-1}
      - API_KEY_LEGACY_STARTED_AT=${API_KEY_LEGACY_STARTED_AT:-}
      - API_KEY_PEPPERS_JSON=${API_KEY_PEPPERS_JSON:-}
      - API_KEY_PEPPER_CURRENT_VERSION=${API_KEY_PEPPER_CURRENT_VERSION:-1}
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # OBS-F2: Liveness probe — solo verifica que el proceso Node.js responde.
      # No usa /health/ready para evitar que un fallo de PostgreSQL reinicie el contenedor.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Internally NextJS SSR calls the API through Nginx or the docker network
        # For client components, they will hit the exposed Nginx url
        - NEXT_PUBLIC_API_URL=https://dev.testimonialcms.local/api/v1
    hostname: web
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /app/apps/web/.next/cache:rw,nosuid,nodev,uid=1001,gid=1001,mode=0700,size=128m
    stop_grace_period: 30s
    depends_on:
      - api
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    hostname: nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - backend_network
    depends_on:
      - api
      - web

volumes:
  postgres18-data:
  pgadmin-data:

networks:
  backend_network:
    driver: bridge
