name: Demo recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la versión anterior compatible con el schema vigente'
        required: true
        type: string
      source_run_id:
        description: 'Run exitoso de Demo release que conserva el manifest y la web anterior'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-delivery
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_DELIVERY_ENABLED: ${{ vars.DEMO_DELIVERY_ENABLED }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release/qualify.mjs

  recover:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: demo
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY: 'true'
      RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
      RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      DEMO_DELIVERY_ENABLED: ${{ vars.DEMO_DELIVERY_ENABLED }}
      DEMO_PROVIDER_PREFLIGHT_COMPLETE: ${{ vars.DEMO_PROVIDER_PREFLIGHT_COMPLETE }}
      DEMO_ROLLBACK_COMPATIBLE_SHA: ${{ vars.DEMO_ROLLBACK_COMPATIBLE_SHA }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
      RAILWAY_SSH_KNOWN_HOSTS: ${{ vars.RAILWAY_SSH_KNOWN_HOSTS }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      API_BACKEND_ORIGIN: ${{ vars.API_BACKEND_ORIGIN }}
      DEMO_WEB_ORIGIN: ${{ vars.DEMO_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install fixed provider CLIs
        run: npm install --global npm@11.19.0 @railway/cli@5.64.2 vercel@63.1.2
      - name: Read evidence only from the successful original release
        run: node scripts/release/recover-manifest.mjs
      - name: Authenticate attestation verification
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Restore recorded backend digest and existing web deployment
        run: node scripts/release/deploy.mjs
      - name: Retain recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-recovery-evidence
          path: |
            release-evidence/manifest.json
            release-evidence/deployment.json
          retention-days: 90
          if-no-files-found: warn
