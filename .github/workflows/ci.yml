name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test?schema=public
      TEST_LOGO_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_BI_SOURCE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test
      TEST_BI_WAREHOUSE_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/postgres
      TEST_BI_REDIS_URL: redis://127.0.0.1:6379/1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testimonial_cms_test
          # Este servicio solo existe durante el job descartable de CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testimonial_cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      warehouse:
        image: postgres:18-alpine
        env:
          # Roles de fixtures sin contraseña: sólo servicio descartable del runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Audit high and critical vulnerabilities
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Generate Prisma client
        run: npm run db:generate --workspace @testimonial-cms/api
      - name: Prepare BI schema fixture
        run: |
          schema_file="$RUNNER_TEMP/bi-source-schema.sql"
          ./node_modules/.bin/prisma migrate diff --from-empty --to-schema-datamodel apps/api/prisma/schema.prisma --script > "$schema_file"
          echo "TEST_BI_BENCHMARK_SCHEMA_FILE=$schema_file" >> "$GITHUB_ENV"
      - name: Install PostgreSQL 18 backup clients
        run: |
          sudo rm -f /etc/apt/sources.list.d/pgdg.list /etc/apt/sources.list.d/pgdg.sources
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Verify PostgreSQL backup client versions
        run: |
          pg_dump --version | grep -E 'PostgreSQL\) 18\.'
          pg_restore --version | grep -E 'PostgreSQL\) 18\.'
      - name: Apply migrations to disposable CI database
        run: npm run db:migrate --workspace @testimonial-cms/api
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Verify Next lint glob compatibility
        run: node --test scripts/test-next-eslint-glob.mjs
      - name: Verify test integrity gates and focused-test controls
        run: node --test scripts/testing/*.test.mjs
      - name: Verify release gates and failure handling without providers
        run: node --test --test-isolation=none scripts/release/*.test.mjs
      - name: Validate GitHub Actions workflows
        run: bash scripts/release/check-workflows.sh
      - name: Test API with complete integration services
        id: api_tests
        run: npm run test:cov --workspace @testimonial-cms/api -- --json --outputFile="$RUNNER_TEMP/api-test-results.json"
      - name: Upload API test results
        if: ${{ always() && (steps.api_tests.outcome == 'success' || steps.api_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-results
          path: ${{ runner.temp }}/api-test-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload API coverage
        if: ${{ always() && (steps.api_tests.outcome == 'success' || steps.api_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Reject incomplete API results
        if: ${{ always() && (steps.api_tests.outcome == 'success' || steps.api_tests.outcome == 'failure') }}
        run: node scripts/testing/check-results.mjs jest "$RUNNER_TEMP/api-test-results.json"
      - name: Test web with coverage and JSON results
        id: web_tests
        run: npm run test:cov --workspace @testimonial-cms/web -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/web-test-results.json"
      - name: Upload web test results
        if: ${{ always() && (steps.web_tests.outcome == 'success' || steps.web_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-test-results
          path: ${{ runner.temp }}/web-test-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload web coverage
        if: ${{ always() && (steps.web_tests.outcome == 'success' || steps.web_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Reject incomplete web results
        if: ${{ always() && (steps.web_tests.outcome == 'success' || steps.web_tests.outcome == 'failure') }}
        run: node scripts/testing/check-results.mjs vitest "$RUNNER_TEMP/web-test-results.json"
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          API_BACKEND_ORIGIN: http://127.0.0.1:4100
        run: npm run build
      - name: Smoke test same-origin web proxy
        timeout-minutes: 3
        run: node scripts/web-proxy-smoke.mjs
      - name: Install pinned Chromium and Linux dependencies
        timeout-minutes: 5
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Verify E2E ownership, privacy and runner failure controls
        timeout-minutes: 3
        run: node --test --test-isolation=none scripts/e2e/*.test.mjs
      - name: Test critical desktop and mobile journeys with exclusive services
        id: e2e_tests
        timeout-minutes: 15
        env:
          # ACK registrado en el plan: sólo PostgreSQL propio, loopback y tmpfs.
          E2E_ALLOW_DISPOSABLE_MIGRATIONS: '1'
        run: npm run test:e2e --workspace @testimonial-cms/web
      - name: Upload sanitized E2E results
        if: ${{ always() && (steps.e2e_tests.outcome == 'success' || steps.e2e_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: |
            apps/web/.e2e-results/results.json
            apps/web/.e2e-results/environment.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify demo configuration, runtime and restricted database identities
        timeout-minutes: 5
        run: |
          node scripts/demo/config.test.mjs
          node scripts/demo/runtime.test.mjs
          node scripts/demo/permissions.integration.mjs
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag testimonial-cms-api:ci .
      - name: Build maintenance image
        run: docker build --file apps/api/Dockerfile --target maintenance --tag testimonial-cms-maintenance:ci .
      - name: Smoke test maintenance image without database or network
        timeout-minutes: 3
        run: bash scripts/ci-smoke-maintenance.sh
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:4000/api/v1 --tag testimonial-cms-web:ci .
      - name: Smoke test production images
        timeout-minutes: 7
        env:
          E2E_ALLOW_DISPOSABLE_MIGRATIONS: '1'
        run: bash scripts/ci-smoke-containers.sh
      - name: Prepare image reports
        id: image_reports
        run: mkdir -p image-reports
      - name: Generate API SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-api:ci
          version: v0.74.0
          format: cyclonedx
          output: image-reports/api-sbom.cdx.json
      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-web:ci
          version: v0.74.0
          format: cyclonedx
          output: image-reports/web-sbom.cdx.json
      - name: Generate maintenance SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-maintenance:ci
          version: v0.74.0
          format: cyclonedx
          output: image-reports/maintenance-sbom.cdx.json
      - name: Scan API image
        id: scan_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-api:ci
          version: v0.74.0
          scanners: vuln
          format: json
          output: image-reports/api-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Scan web image
        id: scan_web
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-web:ci
          version: v0.74.0
          scanners: vuln
          format: json
          output: image-reports/web-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Scan maintenance image
        id: scan_maintenance
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: testimonial-cms-maintenance:ci
          version: v0.74.0
          scanners: vuln
          format: json
          output: image-reports/maintenance-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Upload image reports
        if: ${{ always() && steps.image_reports.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-reports
          path: image-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce image scan
        if: ${{ always() && steps.image_reports.outcome == 'success' }}
        env:
          API_SCAN: ${{ steps.scan_api.outcome }}
          WEB_SCAN: ${{ steps.scan_web.outcome }}
          MAINTENANCE_SCAN: ${{ steps.scan_maintenance.outcome }}
        run: |
          test "$API_SCAN" = success && test "$WEB_SCAN" = success && test "$MAINTENANCE_SCAN" = success
          python3 - <<'PY'
          import json
          from pathlib import Path

          for image in ('api', 'web', 'maintenance'):
              report = json.loads(Path(f'image-reports/{image}-vulnerabilities.json').read_text())
              blocking = [v for result in report.get('Results', [])
                          for v in result.get('Vulnerabilities') or []
                          if v.get('Severity') in ('HIGH', 'CRITICAL')
                          and (image == 'maintenance' or v.get('FixedVersion'))]
              policy = 'totales' if image == 'maintenance' else 'con corrección disponible'
              print(f'{image}: {len(blocking)} vulnerabilidades altas/críticas {policy}')
              if blocking:
                  raise SystemExit(1)
          PY
      - name: Enforce dependency audit
        if: ${{ always() }}
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: test "$NPM_AUDIT" = success

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan changed commits for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: 3.97.5
          extra_args: --results=verified,unknown
