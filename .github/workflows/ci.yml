name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use npm 10
        run: npm install --global npm@10.9.9
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate --workspace @testimonial-cms/api
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
