name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/testimonial_cms_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testimonial_cms_test
          # Este servicio solo existe durante el job descartable de CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testimonial_cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Audit high and critical vulnerabilities
        id: npm_audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Generate Prisma client
        run: npm run db:generate --workspace @testimonial-cms/api
      - name: Apply migrations to disposable CI database
        run: npm run db:migrate --workspace @testimonial-cms/api
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: npm run build
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag testimonial-cms-api:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1:4000/api/v1 --tag testimonial-cms-web:ci .
      - name: Smoke test production images
        run: bash scripts/ci-smoke-containers.sh
      - name: Prepare image reports
        id: image_reports
        run: mkdir -p image-reports
      - name: Generate API SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: testimonial-cms-api:ci
          version: v0.74.0
          format: cyclonedx
          output: image-reports/api-sbom.cdx.json
      - name: Generate web SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: testimonial-cms-web:ci
          version: v0.74.0
          format: cyclonedx
          output: image-reports/web-sbom.cdx.json
      - name: Scan API image
        id: scan_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: testimonial-cms-api:ci
          version: v0.74.0
          scanners: vuln
          format: json
          output: image-reports/api-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Scan web image
        id: scan_web
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: testimonial-cms-web:ci
          version: v0.74.0
          scanners: vuln
          format: json
          output: image-reports/web-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Upload image reports
        if: ${{ always() && steps.image_reports.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-reports
          path: image-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce image scan
        if: ${{ always() && steps.image_reports.outcome == 'success' }}
        env:
          API_SCAN: ${{ steps.scan_api.outcome }}
          WEB_SCAN: ${{ steps.scan_web.outcome }}
        run: |
          test "$API_SCAN" = success && test "$WEB_SCAN" = success
          python3 - <<'PY'
          import json
          from pathlib import Path

          for image in ('api', 'web'):
              report = json.loads(Path(f'image-reports/{image}-vulnerabilities.json').read_text())
              fixable = [v for result in report.get('Results', [])
                         for v in result.get('Vulnerabilities') or []
                         if v.get('Severity') in ('HIGH', 'CRITICAL') and v.get('FixedVersion')]
              print(f'{image}: {len(fixable)} vulnerabilidades altas/críticas con corrección disponible')
              if fixable:
                  raise SystemExit(1)
          PY
      - name: Enforce dependency audit
        if: ${{ always() }}
        env:
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
        run: test "$NPM_AUDIT" = success

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed commits for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: 3.97.5
          extra_args: --results=verified,unknown
