name: Demo migrations

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag anotado con CI aprobado en main'
        required: true
        type: string
      target:
        description: 'Base dedicada a migrar; requiere backup/restauración verificados'
        required: true
        type: choice
        options: [oltp, warehouse]
      maintenance_digest:
        description: 'sha256 de la imagen maintenance publicada y atestada por Demo release'
        required: true
        type: string
      confirmation:
        description: 'APPLY <SHA> <oltp|warehouse>; agregá statistics si DEMO_BI_STATISTICS_MIGRATION=true'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-delivery
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEMO_DELIVERY_ENABLED: ${{ vars.DEMO_DELIVERY_ENABLED }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ENVIRONMENT: demo-migrations
        run: node scripts/release/qualify.mjs

  migrate:
    needs: qualify
    # Dedicated trusted runner with Docker and IPv6 to Supabase direct endpoints.
    # Do not attach this runner to pull_request workflows or use a runner shared with untrusted jobs.
    runs-on: [self-hosted, linux, x64, demo-maintenance-ipv6]
    timeout-minutes: 20
    environment: demo-migrations
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ENVIRONMENT: demo-migrations
      DEMO_DELIVERY_ENABLED: ${{ vars.DEMO_DELIVERY_ENABLED }}
      TARGET: ${{ inputs.target }}
      MAINTENANCE_DIGEST: ${{ inputs.maintenance_digest }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DEMO_MIGRATIONS_ENABLED: ${{ vars.DEMO_MIGRATIONS_ENABLED }}
      DEMO_BI_STATISTICS_MIGRATION: ${{ vars.DEMO_BI_STATISTICS_MIGRATION || 'false' }}
      SUPABASE_OLTP_HOST: ${{ vars.SUPABASE_OLTP_HOST }}
      SUPABASE_WAREHOUSE_HOST: ${{ vars.SUPABASE_WAREHOUSE_HOST }}
      OLTP_CA_PEM: ${{ vars.OLTP_CA_PEM }}
      WAREHOUSE_CA_PEM: ${{ vars.WAREHOUSE_CA_PEM }}
      MIGRATION_DATABASE_URL: ${{ inputs.target == 'oltp' && secrets.OLTP_MIGRATION_DATABASE_URL || secrets.WAREHOUSE_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Validate explicit authorization before any database operation
        run: |
          node --input-type=module - <<'JS'
          import {qualify} from './scripts/release/qualify.mjs';
          import {digestPattern} from './scripts/release/providers.mjs';
          import {migrationPlan} from './scripts/release/migrate.mjs';
          const release = await qualify(process.env);
          if (release.sha !== process.env.RELEASE_SHA) throw new Error('RELEASE_MANIFEST_MISMATCH');
          if (!digestPattern.test(process.env.MAINTENANCE_DIGEST)) throw new Error('RELEASE_IMAGE_INVALID');
          const plan = migrationPlan(process.env, process.env.TARGET, process.env.RELEASE_SHA, process.env.CONFIRMATION);
          plan.cleanup();
          JS
      - name: Verify maintenance identity and execute only the selected migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/maintenance@$MAINTENANCE_DIGEST"
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/demo-release.yml" \
            --source-digest "$RELEASE_SHA" --deny-self-hosted-runners
          docker pull "$image"
          container_name="demo-migrate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT INT TERM
          docker run --rm --name "$container_name" --read-only --tmpfs /tmp --network host \
            --cap-drop ALL --security-opt no-new-privileges \
            --env DEMO_MIGRATIONS_ENABLED --env DEMO_BI_STATISTICS_MIGRATION --env MIGRATION_DATABASE_URL \
            --env SUPABASE_OLTP_HOST --env SUPABASE_WAREHOUSE_HOST --env OLTP_CA_PEM --env WAREHOUSE_CA_PEM \
            "$image" /app/scripts/release/migrate.mjs "$TARGET" "$RELEASE_SHA" "$CONFIRMATION"
      - name: Clear registry authentication on the dedicated runner
        if: ${{ always() }}
        run: docker logout ghcr.io
      - name: Record public migration identity and outcome
        if: ${{ always() }}
        env:
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
        run: |
          node --input-type=module - <<'JS'
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {digestPattern} from './scripts/release/providers.mjs';
          const env=process.env;
          mkdirSync('release-evidence',{recursive:true});
          writeFileSync('release-evidence/migration.json',JSON.stringify({
            version:1,sha:env.RELEASE_SHA,tag:env.RELEASE_TAG,target:env.TARGET,
            statistics:env.TARGET==='warehouse'&&env.DEMO_BI_STATISTICS_MIGRATION==='true',
            digest:digestPattern.test(env.MAINTENANCE_DIGEST)?env.MAINTENANCE_DIGEST:undefined,
            runId:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,outcome:env.MIGRATION_OUTCOME,
          },null,2)+'\n');
          JS
      - name: Retain migration evidence without database credentials or logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-migration-evidence
          path: release-evidence/migration.json
          retention-days: 90
          if-no-files-found: warn
